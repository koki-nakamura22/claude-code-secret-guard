[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-code-secret-guard"
version = "0.2.1"
description = "Keep secrets out of Claude Code permission rules and out of git."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Koki NAKAMURA" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.optional-dependencies]
dev = ["pytest", "pyright", "ruff"]

[project.scripts]
secret-guard = "secret_guard.cli:main"

[project.urls]
Homepage = "https://github.com/koki-nakamura22/claude-code-secret-guard"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.9"
extraPaths = ["src", "tests"]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
