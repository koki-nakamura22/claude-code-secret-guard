name: Claude Code secret guard
description: Fail when .claude/settings.local.json is committed, or a committed .claude/settings.json contains a secret.
branding:
  icon: shield
  color: red
runs:
  using: composite
  steps:
    - name: Check Claude Code settings
      shell: bash
      run: |
        mapfile -d '' files < <(git ls-files -z -- ':(glob)**/.claude/settings.json' ':(glob)**/.claude/settings.local.json')
        if [ "${#files[@]}" -eq 0 ]; then
          echo "secret-guard: no Claude Code settings files are tracked"
          exit 0
        fi
        python3 -I "$GITHUB_ACTION_PATH/bin/secret-guard" check "${files[@]}"
